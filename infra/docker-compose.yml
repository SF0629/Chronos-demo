services:
    postgres:
        image: postgres:18.4
        container_name: chronos-postgres
        restart: unless-stopped

        env_file:
            - ../.env

        ports:
            - "5432:5432"

        volumes:
            - chronos-postgres-data:/var/lib/postgresql

        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5

    prometheus:
        image: prom/prometheus
        container_name: chronos-prometheus
        ports:
            - "9090:9090"
        volumes:
            - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"

volumes:
    chronos-postgres-data:
