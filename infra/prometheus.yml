global:
    scrape_interval: 15s

scrape_configs:
    - job_name: prometheus
      static_configs:
          - targets:
                - localhost:9090

    - job_name: chronos-api
      static_configs:
          - targets:
                - host.docker.internal:4000

    - job_name: demo-app
      scrape_interval: 5s
      static_configs:
          - targets:
                - demo-app:4100
